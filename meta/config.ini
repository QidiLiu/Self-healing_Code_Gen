[model]
; provider/model format, e.g. deepseek/deepseek-v4-pro
provider_model = deepseek/deepseek-v4-pro
; API key (lowest priority after --api-key; env var wins over this file)
api_key =
; Custom API base URL (optional)
base_url =
; opencode server port. Change this if you already run opencode on 4096.
server_port = 4096
max_retries = 4
max_replans = 2
; Consecutive provider/model failures before declaring the run stuck.
; These are NOT charged against max_retries.
max_infra_errors = 3
; Hard cap on state-machine iterations. Empty = (max_retries+1)*(max_replans+1)+2
max_total_iterations =
