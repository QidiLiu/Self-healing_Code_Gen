[model]
; provider/model format. Requires @opencode/sdk 2.x and opencode CLI 2.x.
provider_model = deepseek/deepseek-flash
; API key. Usually unnecessary: credentials from `opencode auth login` are read
; from the shared opencode database. Set this only for a provider the CLI cannot
; store, or to override the stored credential.
api_key =
; Custom API base URL (optional)
base_url =
max_retries = 4
max_replans = 2
; Consecutive provider/model failures before declaring the run stuck.
; These are NOT charged against max_retries.
max_infra_errors = 3
; Hard cap on state-machine iterations. Empty = (max_retries+1)*(max_replans+1)+2
max_total_iterations =
